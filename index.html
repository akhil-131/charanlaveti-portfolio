<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CHARAN — Freelance Video Editor</title>
  <meta name="description"
    content="Charan — Freelance video editor specializing in high-retention Reels, talking-head videos, color grading, and long-form YouTube edits that perform.">
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎬</text></svg>">

  <!-- Google Fonts Preconnect & Editorial Serif Webfonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,400;1,500;1,600&family=Cormorant+Garamond:ital,wght@1,400;1,500;1,600&display=swap">

  <!-- Modular CSS Files -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/preloader.css">
  <link rel="stylesheet" href="css/cursor.css">
  <link rel="stylesheet" href="css/navbar-dock.css">
  <link rel="stylesheet" href="css/hero-about.css">
  <link rel="stylesheet" href="css/work.css">
  <link rel="stylesheet" href="css/stats-tools.css">
  <link rel="stylesheet" href="css/contact-footer.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>

<body class="preloader-active">

  <!-- 3-Second Cinematic Intro Preloader (EDIT, GRADE, DELIVER) -->
  <aside id="sitePreloader" class="site-preloader" aria-label="Intro animation">
    <!-- Ambient Goldish Atmosphere Orbs -->
    <div class="preloader-glow-top" aria-hidden="true"></div>
    <div class="preloader-glow-center" aria-hidden="true"></div>

    <div class="preloader-content">
      <div class="preloader-words">
        <span class="preloader-word word-edit">EDIT<span class="preloader-dot">.</span></span>
        <span class="preloader-word word-grade">GRADE<span class="preloader-dot">.</span></span>
        <span class="preloader-word word-deliver">DELIVER<span class="preloader-dot">.</span></span>
      </div>
    </div>

    <!-- Very Bottom Faded Progress Loading Bar -->
    <div class="preloader-progress-wrap" aria-hidden="true">
      <div class="preloader-progress-bar"></div>
    </div>
  </aside>

  <!-- Film Grain Overlay -->
  <div class="film-grain" aria-hidden="true"></div>

  <!-- Goldish Cursor Animation Layers -->
  <div id="cursorGlow" class="cursor-glow" aria-hidden="true"></div>
  <canvas id="cursorCanvas" class="cursor-canvas" aria-hidden="true"></canvas>
  <div id="cursorRing" class="cursor-ring" aria-hidden="true"></div>
  <div id="cursorDot" class="cursor-dot" aria-hidden="true"></div>

  <!-- Ambient Gold Glow Orbs -->
  <div class="bg-glow-1" aria-hidden="true"></div>
  <div class="bg-glow-2" aria-hidden="true"></div>

  <!-- Toast Notification -->
  <div id="toastNotification" class="toast-notification" role="status" aria-live="polite"></div>

  <!-- 6 Section Slots matching your 6 files in /sections -->
  <div id="navbar-slot"></div>
  <div id="hero-slot"></div>
  <div id="about-slot"></div>
  <div id="work-slot"></div>
  <div id="stats-tools-slot"></div>
  <div id="contact-footer-slot"></div>

  <!-- Modular JS Files -->
  <script src="js/cursor.js"></script>
  <script src="js/animations.js"></script>
  <script src="js/work.js"></script>
  <script src="js/nav-dock.js"></script>
  <script src="js/contact.js"></script>
  <script src="js/preloader.js"></script>
  <script src="js/loader.js"></script>
</body>

</html>
